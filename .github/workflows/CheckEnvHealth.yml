# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Check EnvHealth

# Set conditions for action
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    
# Set permissions as low as possible
permissions:
  contents: read
# A container that holds all instructions
jobs:

# The name of the job
  test-pixi:
  
    # Test env on various platforms
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        
    # Steps required to complete the action
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
        
    - name: Install Pixi
      uses: prefix-dev/setup-pixi@v0.10.1
      with:
        pixi-version: v0.69.0
        activate-environment: true
        cache: true

    - name: Run a test command
      run: pixi run python -c "print('Pixi environment is healthy')"
